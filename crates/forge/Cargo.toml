[package]
name = "forge"
description = "Forge model and the GitHub, Forgejo and GitLab backends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait = "0.1.89"
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
dirs = "6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2", "gzip"] }
tokio = { version = "1.47", features = ["rt", "sync", "time", "process", "fs", "macros"] }

[dev-dependencies]
flate2 = "1.1"
tokio = { version = "1.47", features = ["net", "io-util"] }

[lints]
workspace = true
