[package]
name = "app"
description = "The review application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "review"
path = "src/main.rs"

[dependencies]
diff.workspace = true
diff_view.workspace = true
forge.workspace = true
store.workspace = true
repo.workspace = true
scroll.workspace = true
log_view.workspace = true
term.workspace = true
term_view.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
futures = "0.3.31"
toml = "1.2.1"
toml_edit = "0.25.19"
getrandom = "0.3.4"
gpui.workspace = true
gpui-platform.workspace = true
gpui-kit.workspace = true
theme.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dirs = "6"
image = { version = "0.25.10", default-features = false }
sha2 = "0.10.9"
markdown = "1.0.0"
unicode-general-category = "1.1.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
perf.workspace = true
async-trait = "0.1.89"
tokio = { version = "1.47", features = ["rt", "macros", "time"] }

[lints]
workspace = true
